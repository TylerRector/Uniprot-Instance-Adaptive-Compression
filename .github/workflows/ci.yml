name: Verify Python and Lean 4

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 100-protein corpus and pooled archives
        run: python -m unittest discover -s tests -v
      - name: Regenerate metrics and archives
        run: |
          python src/experiment.py
          python src/pool_archive.py

  lean4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Kernel-check feature preservation theorems
        run: lean Lean/FunctionGuard.lean
